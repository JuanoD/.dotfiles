context.modules = [
{ name = libpipewire-module-adapter
  condition = [ { module.adapter = !false } ]
}
# { name = libpipewire-module-protocol-native }
{ name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Mic Dennoiser"
      media.name = "Mic Dennoiser"
      # audio.channels = 2
      # audio.position = [ FL FR ]

      # Define the filter graph
      filter.graph = {
        nodes = [
          {
            type = lv2
            name = st
            plugin = "http://calf.sourceforge.net/plugins/StereoTools"
            label = "StereoTools"
            control = {
              bypass = 0
              level_in = 1
              level_out = 1
              balance_in = 0
              balance_out = 0
              softclip = 0
              mutel = 0
              muter = 0
              phasel = 0
              phaser = 0
              mode = 3
              slev = 1
              sbal = 0
              mlev = 1
              mpan = 0
              stereo_base = 0
              delay = 0
              sc_level = 1
              stereo_phase = 0
            }
          }
          {
            type = ladspa
            name = rnnoise
            plugin = "/home/juanod/.ladspa/librnnoise_ladspa.so"
            label = noise_suppressor_stereo
            control = {
              "VAD Threshold (%)" = 60
              "VAD Grace Period (ms)" = 20
              "Retroactive VAD Grace (ms)" = 0
            }
          }
          # {
          #   type = lv2
          #   name = gt
          #   plugin = "http://calf.sourceforge.net/plugins/Gate"
          #   label = "Gate"
          #   control = {
          #     bypass = 0
          #     level_in = 1
          #     range = 0.0612500011920929
          #     threshold = 0.125
          #     ratio = 2
          #     attack = 20
          #     release = 250
          #     makeup = 1
          #     knee = 2.82842993736267
          #     detection = 0
          #     stereo_link = 0
          #   }
          # }
        ]
        links = [
          { output = "st:out_l"            input = "rnnoise:Input (L)" }
          { output = "st:out_r"            input = "rnnoise:Input (R)" }
          # { output = "rnnoise:Output (L)"   input = "gt:in_l" }
          # { output = "rnnoise:Output (R)"   input = "gt:in_r" }
        ]
        inputs =  [ "st:in_l"    "st:in_r" ]
        # outputs = [ "gt:out_l"   "gt:out_r" ]
        outputs = [ "rnnoise:Output (L)"   "rnnoise:Output (R)" ]
      }

      capture.props = {
        node.name = "effect_input.dennoiser"
        # media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        node.passive = true
      }

      playback.props = {
        node.name = "effect_output.dennoiser"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
        media.class = "Audio/Source"
      }
    }
  }
]
