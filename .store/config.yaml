stores:
    bin:
        target: ~/.local/bin
        patterns:
            - '*'
    config:
        MangoHud:
            target: ~/.config/MangoHud
        ghostty:
            target: ~/.config/ghostty
        helix:
            target: ~/.config/helix
        herdr:
            target: ~/.config/herdr
            files:
                - config.toml
        herdr-app:
            target: ~/.config/herdr-app
            files:
                - mods/my-pane/main.js
                - mods/my-pane/vscode.svg
                - mods/my-pane/mod.json
                - mods/my-pane/close.svg
                - mods/my-pane/split-down.svg
                - mods/my-pane/split-right.svg
                - mods/my-pane/unzoom.svg
                - mods/my-pane/zoom.svg
                - layouts/my-main.json
        k9s:
            target: ~/.config/k9s
        kanata:
            target: ~/.config/kanata
        kitty:
            target: ~/.config/kitty
            files:
                - kitty.conf
        kube:
            target: ~/.kube
            files:
                - kubie.yaml
        mise:
            target: ~/.config/mise
        mprocs:
            target: ~/.config/mprocs
        niri:
            target: ~/.config/niri
        nvim:
            target: ~/.config/nvim
        pipewire:
            pipewire.conf.d:
                target: ~/.config/pipewire/pipewire.conf.d
                patterns:
                    - '*'
        starship:
            target: ~/.config
            files:
                - starship.toml
        systemd:
            user:
                target: ~/.config/systemd/user
                patterns:
                    - '*'
        yazi:
            target: ~/.config/yazi
        zellij:
            target: ~/.config/zellij
